<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WriteFlow</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0F6E7A"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F5F8;--sheet:#fff;--ink:#12202F;--ink2:#52627A;--line:#DCE2EA;--wash:#EAEFF5;--accent:#0F6E7A;--accent-ink:#fff;--mark:#FFE066;--mark-ink:#3a2f00;--alert:#C4372B;--warn:#A85F08;--ok:#2E7D4F;--r:8px;
 --serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --bg:var(--paper);--card:var(--sheet);--mute:var(--ink2);--brand:var(--accent);--brand-ink:var(--accent-ink);--chip:var(--wash);--bad:var(--alert)}
:root[data-theme=dark]{--paper:#0D141B;--sheet:#141D26;--ink:#E8EEF5;--ink2:#9AABBE;--line:#233140;--wash:#1B2733;--accent:#58BDC9;--accent-ink:#04222A;--mark:#E9CB4A;--mark-ink:#2A2200;--alert:#FF8073;--warn:#E3A24A;--ok:#6CC490}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--paper:#0D141B;--sheet:#141D26;--ink:#E8EEF5;--ink2:#9AABBE;--line:#233140;--wash:#1B2733;--accent:#58BDC9;--accent-ink:#04222A;--mark:#E9CB4A;--mark-ink:#2A2200;--alert:#FF8073;--warn:#E3A24A;--ok:#6CC490}}
*{box-sizing:border-box}
body{margin:0;font:14.5px/1.5 var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.app.login{grid-template-columns:1fr}.app.login aside,.app.login .mbar{display:none}
aside{background:var(--sheet);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;margin:0 6px 18px;font:600 17px var(--serif)}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font:600 15px var(--serif);font-style:normal}
aside a.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);color:var(--ink2);font-weight:500}
aside a.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
aside a.nav:hover{background:var(--wash);color:var(--ink);text-decoration:none}
aside a.nav.on{background:var(--wash);color:var(--ink);box-shadow:inset 3px 0 0 var(--mark)}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.status{font-size:12px;padding:4px 6px}
main{padding:28px clamp(16px,3vw,40px) 64px;min-width:0;max-width:1240px;width:100%}
.mbar{display:none}
.top{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.top h2,.head h1{margin:0;font:600 28px/1.2 var(--serif);letter-spacing:-.01em;flex:1;min-width:200px}
.head{display:flex;gap:16px;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap}.head>div:first-child{flex:1;min-width:260px}
.head .acts{display:flex;gap:8px}
.sub{margin:6px 0 0;color:var(--ink2)}
.meta2{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink2);margin-top:8px;align-items:center}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:7px 13px;border-radius:var(--r);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s}
button:hover,.btn:hover{background:var(--wash);text-decoration:none}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}button.pri:hover{background:var(--accent);filter:brightness(1.1)}
button.sm{padding:3px 9px;font-size:12.5px}
button.link{border:0;background:none;color:var(--accent);padding:0;text-align:left}button.link:hover{background:none;text-decoration:underline}
button.danger{color:var(--alert)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
.card,.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h3,.panel h2{margin:0 0 12px;font:600 15px var(--sans)}
.empty{text-align:center;color:var(--ink2);padding:30px 18px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:18px;align-items:start}
@media(max-width:980px){.cols{grid-template-columns:1fr}}
.chip{display:inline-block;background:var(--wash);border-radius:5px;padding:1px 8px;font-size:12px;font-weight:500;margin-right:4px;color:var(--ink2)}
.chip.ok{background:var(--ok);color:var(--paper)}.chip.warn{background:var(--warn);color:var(--paper)}.chip.bad{background:var(--alert);color:var(--paper)}.chip.mark{background:var(--mark);color:var(--mark-ink)}
.mute{color:var(--ink2)}.sm2{font-size:12.5px}.row{display:flex;gap:8px;align-items:center}.sp{flex:1;min-width:0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--ink2);font-weight:500;font-size:12.5px}
tr.click{cursor:pointer}tr.click:hover{background:var(--wash)}
.grp{margin:16px 0 2px;font-weight:600;color:var(--ink2);font-size:13px}.grp:first-of-type{margin-top:0}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink)}.item:hover{text-decoration:none;background:var(--wash)}
.item .it{font-weight:500}
.wlist{border:1px solid var(--line);border-radius:10px;background:var(--sheet);overflow:hidden;margin-bottom:16px}
.wrow{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(150px,1.3fr) 150px 110px;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.wrow:last-child{border-bottom:0}.wrow:hover{background:var(--wash)}
.ttl{font:600 15.5px/1.3 var(--serif)}.ttl2{font:600 14px/1.3 var(--serif);margin-bottom:2px}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--ink2);font-size:12.5px;margin-top:2px}
.stg{font-size:12.5px;font-weight:500;margin-top:5px}
@media(max-width:820px){.wrow{grid-template-columns:1fr auto}.wrow .c4{display:none}.wrow .c2{grid-column:1/-1}}
.rail{display:flex;align-items:flex-start;overflow-x:auto;padding:6px 0 8px}
.rail .nd{flex:1 0 auto;min-width:78px;position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;padding:0 4px;color:var(--ink2);font-size:12px;cursor:pointer}
.rail .nd:hover{background:none}.rail .nd:hover i{border-color:var(--accent)}
.rail .nd i{width:13px;height:13px;border-radius:50%;background:var(--sheet);border:2px solid var(--line);position:relative;z-index:1}
.rail .nd::before{content:'';position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--line)}
.rail .nd:first-child::before{display:none}
.rail .nd.done i{background:var(--accent);border-color:var(--accent)}
.rail .nd.done::before,.rail .nd.now::before{background:var(--accent)}
.rail .nd.now i{border-color:var(--ink);background:var(--mark);box-shadow:0 0 0 3px color-mix(in srgb,var(--mark) 45%,transparent)}
.rail .nd em{font-style:normal;padding:0 6px;border-radius:4px;white-space:nowrap}
.rail .nd.now em{background:var(--mark);color:var(--mark-ink);font-weight:600}
.rail.c{padding:0;gap:5px;align-items:center;overflow:visible}
.rail.c .nd{flex:0 0 auto;min-width:0;padding:0;gap:0;cursor:default}
.rail.c .nd i{width:9px;height:9px;border-width:1.5px}
.rail.c .nd::before{display:none}
.rail.c .nd.now i{width:12px;height:12px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.col{min-width:224px;max-width:224px;background:var(--wash);border-radius:10px;padding:10px;min-height:120px}
.col.over{outline:2px dashed var(--accent)}
.col h4{margin:2px 4px 10px;font:600 13px var(--sans);color:var(--ink2);display:flex;justify-content:space-between}
.kc{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:grab}
.kc:hover{border-color:var(--accent)}.kc.drag{opacity:.4}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0;flex-wrap:wrap;position:sticky;top:0;background:var(--paper);z-index:5}
.tabs a{padding:9px 14px;color:var(--ink2);border-bottom:2px solid transparent;font-weight:500;margin-bottom:-1px}
.tabs a:hover{color:var(--ink);text-decoration:none}.tabs a.on{color:var(--ink);border-color:var(--ink)}
.bar{height:5px;background:var(--wash);border-radius:5px;overflow:hidden;margin-bottom:3px}.bar i{display:block;height:100%;background:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.form label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}.form .full{grid-column:1/-1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--sheet);color:var(--ink);padding:22px;width:min(580px,94vw);box-shadow:0 24px 60px rgba(10,20,30,.28)}
dialog::backdrop{background:rgba(10,20,30,.5)}
dialog[open]{animation:pop .14s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){dialog[open]{animation:none}.toast{transition:none}}
.pt{border-left:3px solid var(--line);padding:6px 12px;margin:8px 0}.pt.done{border-color:var(--ok)}
.viewer{position:fixed;inset:0;z-index:40;background:var(--paper);display:none;flex-direction:column}.viewer.on{display:flex}
.vbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--sheet);border-bottom:1px solid var(--line);flex-wrap:wrap}
.vt{flex:1;min-width:160px;display:flex;flex-direction:column;min-width:0}.vt b{font:600 15px var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsel{width:auto;max-width:280px}.vtools{display:flex;gap:8px;flex-wrap:wrap}
.vbody{flex:1;min-height:0;display:flex}.vframe{flex:1;border:0;width:100%;height:100%;background:#fff}
.vmsg{margin:auto;color:var(--ink2);text-align:center;padding:24px}
.vimg{margin:auto;max-width:100%;max-height:100%;object-fit:contain;padding:16px}
.vtext{margin:0;padding:20px;overflow:auto;flex:1;white-space:pre-wrap;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace}
.noscroll{overflow:hidden}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.app{grid-template-columns:1fr}
 aside{position:fixed;z-index:30;left:0;top:0;width:252px;transform:translateX(-100%);transition:transform .2s}body.menu aside{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
 .mbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sheet);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;font:600 16px var(--serif)}
 main{padding-top:18px}.top h2,.head h1{font-size:23px}}
.c1{display:flex;gap:12px;align-items:flex-start}.selbox{margin-top:4px}
.bulk{position:sticky;top:0;z-index:6;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;margin-bottom:12px}
.bulk select{width:auto;background:var(--sheet);color:var(--ink)}.bulk .sp{flex:1}
.bars{display:flex;align-items:flex-end;gap:4px;height:64px;min-width:160px}.bars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px}
.app.pub main{padding:0;max-width:none}
.pubbar{display:flex;gap:18px;align-items:center;padding:12px clamp(16px,3vw,32px);background:var(--sheet);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.pubbar nav{display:flex;gap:4px}.pubbar nav a{padding:6px 12px;border-radius:var(--r);color:var(--ink2);font-weight:500}.pubbar nav a:hover{background:var(--wash);text-decoration:none}.pubbar nav a.on{background:var(--wash);color:var(--ink)}
.pubmain{max-width:1100px;margin:0 auto;padding:26px clamp(16px,3vw,32px) 64px}
</style>
</head>
<body>

<script>
/* ---------- Config ---------- */
const TYPES=['Grant proposal','Journal article','Conference paper','Research','Book chapter','Book','Case study','Report / policy brief','Other'];
const PIPE={
 'Grant proposal':['Idea','Concept note','Drafting','Internal review','Submitted','Awarded','Declined'],
 'Journal article':['Idea','Outline','Drafting','Internal review','Submitted','Under review','Revisions','Accepted','Published','Rejected'],
 'Conference paper':['Idea','Abstract','Drafting','Internal review','Submitted','Revisions','Accepted','Published','Rejected'],
 'Research':['Idea','Design','Data collection','Analysis','Writing','Review','Complete'],
 'Book chapter':['Proposal','Outline','Drafting','Internal review','Submitted','Under review','Revisions','Accepted','In press','Published'],
 'Book':['Proposal','Outline','Drafting','Internal review','Submitted','Under review','Revisions','Accepted','In press','Published'],
 'Case study':['Idea','Fieldwork','Drafting','Review','Final'],
 'Report / policy brief':['Idea','Drafting','Review','Final'],
 'Other':['Idea','Drafting','Review','Final']};
const CLOSED=['Published','Awarded','Declined','Rejected','Final','Complete','In press'];
const KINDS=['Draft','Shared for review','Submitted','Revised','Final','Reviewer response','Supporting'];
const DECISIONS=['Pending','Accept','Minor revision','Major revision','Reject','Internal feedback','Funded','Not funded'];
const SUBST=['Submitted','Under review','Revise & resubmit','Accepted','Rejected','Withdrawn'];

/* ---------- State ---------- */
const KEY='writeflow.v1';
let state=load();
function fix(s){s.contacts=s.contacts||[];s.venues=s.venues||[];s.settings=s.settings||{};(s.projects=s.projects||[]).forEach(p=>{p.team=p.team||[];p.log=p.log||[];p.tasks=p.tasks||[];p.versions=p.versions||[];p.reviews=p.reviews||[];p.submissions=p.submissions||[]});return s}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.projects)return fix(s)}catch(e){}return fix({projects:[],settings:{},updated:0})}
function save(){state.updated=Date.now();localStorage.setItem(KEY,JSON.stringify(state));render();scheduleSync()}
const uid=()=>Math.random().toString(36).slice(2,10);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoDate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const today=()=>isoDate(new Date());
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const days=d=>d?Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5):null;
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—';
const P=id=>state.projects.find(p=>p.id===id);
const isActive=p=>!CLOSED.includes(p.stage);
function dueChip(d){if(!d)return'';const n=days(d);const c=n<0?'bad':n<=14?'warn':'';return`<span class="chip ${c}">${n<0?Math.abs(n)+'d overdue':n===0?'today':n+'d'}</span>`}

/* ---------- Google Drive & accounts ---------- */
let tokenClient,syncTimer,syncMsg='',signedIn=false,offline=false,TOK={};
const accts=()=>state.settings.accounts||[];
const primary=()=>(accts().find(a=>a.primary)||accts()[0]||{}).email;
const acctOf=p=>p.account||primary();
const tokenOk=e=>TOK[e]&&Date.now()<TOK[e].exp-60000;
function initGIS(){const id=state.settings.clientId;if(!id||!window.google)return;
 tokenClient=google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/calendar.events',callback:()=>{}})}
function setSync(m){if(m)syncMsg=m;else syncMsg=!state.settings.clientId?'Set Client ID in Settings':signedIn?(offline?'Offline: saved on this device':'Drive: connected'):'Not signed in';
 const el=$('#sync');if(el)el.innerHTML=esc(syncMsg)+(signedIn&&(offline||!tokenOk(primary()))?'<br><button class="sm" data-a="connect">Reconnect</button>':'')}
function drawAccts(){const el=$('#accts');if(el)el.innerHTML='<div class="mute" style="font-size:12px;padding:0 8px"><b>Accounts</b>'+accts().map(a=>`<div>${esc(a.email)}${a.primary?' ★':''}</div>`).join('')+'</div>'}
function requestToken(hint,select){return new Promise((res,rej)=>{
 if(!tokenClient)initGIS();
 if(!tokenClient)return rej(new Error('Google sign-in is still loading or the Client ID is missing. Try again in a moment.'));
 tokenClient.callback=r=>{if(r.error)return rej(new Error(r.error));res({t:r.access_token,exp:Date.now()+r.expires_in*1000})};
 tokenClient.error_callback=e=>rej(new Error(e.type||'Google sign-in failed'));
 tokenClient.requestAccessToken(select?{prompt:'select_account'}:{prompt:'',hint})})}
async function whoami(t){const r=await fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress,displayName)',{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw new Error('Could not verify the Google account (is the Drive API enabled?)');return(await r.json()).user}
async function getToken(email){email=email||primary();if(tokenOk(email))return TOK[email].t;
 const r=await requestToken(email,false);const u=await whoami(r.t);
 if(u.emailAddress.toLowerCase()!==email)throw new Error('You signed in as '+u.emailAddress+' but '+email+' is needed');
 TOK[email]=r;setSync();return r.t}
async function addAccount(){const r=await requestToken('',true);const u=await whoami(r.t),email=u.emailAddress.toLowerCase();TOK[email]=r;
 const list=accts();let a=list.find(x=>x.email===email);if(!a){a={email,name:u.displayName,primary:!list.length};list.push(a)}state.settings.accounts=list;return a}
async function g(url,o={},acct){const t=await getToken(acct);const r=await fetch(url,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+t}});if(!r.ok)throw new Error((await r.text()).slice(0,300));return r}
async function ensureFolder(name,parent,acct){
 const q=`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`+(parent?` and '${parent}' in parents`:'');
 const r=await(await g('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+encodeURIComponent(q),{},acct)).json();
 if(r.files[0])return r.files[0].id;
 const c=await(await g('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:parent?[parent]:undefined})},acct)).json();
 return c.id}
async function rootFolder(acct){acct=acct||primary();const m=state.settings.rootIds=state.settings.rootIds||{};
 if(!m[acct]){if(acct===primary()&&state.settings.rootId)m[acct]=state.settings.rootId;else m[acct]=await ensureFolder('WriteFlow','',acct)}return m[acct]}
async function projectFolder(p){if(p.folderId)return p.folderId;const a=acctOf(p);const root=await rootFolder(a);p.folderId=await ensureFolder(p.title.replace(/[\\/]/g,'-').slice(0,80)||'Untitled',root,a);return p.folderId}
async function driveUpload(file,folderId,name,acct){
 const type=file.type||'application/octet-stream';
 const init=await g('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,webViewLink,size',{method:'POST',headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':type},body:JSON.stringify({name,parents:[folderId]})},acct);
 const loc=init.headers.get('Location');
 const up=await fetch(loc,{method:'PUT',headers:{'Content-Type':type},body:file});
 if(!up.ok)throw new Error('Upload failed: '+up.status);return up.json()}
async function findData(){const root=await rootFolder();
 const q=`name='writeflow-data.json' and '${root}' in parents and trashed=false`;
 return(await(await g('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+encodeURIComponent(q))).json()).files[0]}
async function pushData(){
 const f=await findData();const body=JSON.stringify(state);
 if(f){await g(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body})}
 else{const root=await rootFolder();const b='wfb'+uid();
  const mp=`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name:'writeflow-data.json',parents:[root]})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  await g('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp})}}
async function pullData(){const f=await findData();if(!f)return null;return(await g(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).json()}
function scheduleSync(){if(!signedIn||offline)return;clearTimeout(syncTimer);setSync('Drive: saving…');
 syncTimer=setTimeout(async()=>{try{await pushData();snapshot().catch(()=>{});pushPublic().catch(()=>{});setSync('Drive: saved '+new Date().toLocaleTimeString())}catch(e){setSync('Sync failed - reconnect')}},2000)}
function mergeAcc(a=[],b=[]){const m=[...a];b.forEach(x=>{if(!m.find(y=>y.email===x.email))m.push({...x,primary:false})});return m}
async function syncDown(){const remote=await pullData();
 if(remote&&(remote.updated||0)>state.updated&&(!state.projects.length||confirm("A newer copy exists in Google Drive. Load it? (Cancel keeps this browser's copy and overwrites Drive)"))){
  const keep=state.settings;state=fix(remote);state.settings={...remote.settings,...keep,accounts:mergeAcc(keep.accounts,(remote.settings||{}).accounts)};localStorage.setItem(KEY,JSON.stringify(state))}
 else await pushData();
 setSync('Drive: connected & synced')}
async function doLogin(){try{if(primary())await getToken(primary());else await addAccount();
 signedIn=true;localStorage.setItem(KEY,JSON.stringify(state));await syncDown();render();notifyDue()}
 catch(e){signedIn=false;alert(e.message);render()}}
async function signOut(){if(!confirm("Sign out? Changes are synced to Drive first, then this device's local copy is cleared."))return;
 try{clearTimeout(syncTimer);await pushData()}catch(e){if(!confirm('Could not sync to Drive ('+e.message+'). Sign out anyway and lose unsynced changes on this device?'))return}
 const keep={clientId:state.settings.clientId,accounts:accts().map(a=>({...a}))};
 state=fix({projects:[],settings:keep,updated:0});localStorage.setItem(KEY,JSON.stringify(state));TOK={};signedIn=false;location.hash='';render()}
function loginView(){const has=!!state.settings.clientId;
 return`<div style="max-width:420px;margin:12vh auto"><div class="card" style="padding:24px;text-align:center"><div class="brand" style="justify-content:center;margin:0 0 12px"><i>W</i>WriteFlow</div><p class="mute">Sign in with Google to load your writings from Drive.</p>
 ${has?`<button class="pri" data-a="login" style="width:100%;padding:10px">Sign in with Google</button>${state.projects.length?'<button data-a="goOffline" style="width:100%;margin-top:8px">Open offline copy</button>':''}${primary()?`<p class="mute">Primary account: ${esc(primary())}</p>`:''}`
 :`<div style="text-align:left"><label class="mute">Google OAuth Client ID</label><input id="cid" placeholder="xxxx.apps.googleusercontent.com"><button class="pri" data-a="saveClient" style="margin-top:8px;width:100%">Save and continue</button><p class="mute"><a target="_blank" rel="noopener" href="https://github.com/michaelouru-sw/writeflow#2-connect-google-drive-one-time-free">How to get one</a></p></div>`}

 const grp=(t,a)=>a.length?`<div class="grp">${t}</div>${a.slice(0,8).map(itemRow).join('')}`:'';

 if(!state.projects.length)return head+`<div class="card empty"><b style="color:var(--ink)">No writings yet</b><p>Import your existing folders from Drive, or start with a new grant, article or chapter.</p><div class="row" style="justify-content:center"><button data-a="importDrive">Import from Drive</button><button class="pri" data-a="newProject">New writing</button></div></div>`;
 return head+`<div class="cols"><section class="panel"><h2>Needs attention</h2>${grp('Overdue',od)}${grp('This week',wk)}${grp('Next 30 days',lt)}${items.some(i=>days(i.d)<=30)?'':'<span class="mute">Nothing due in the next 30 days.</span>'}</section>

function reviews(p){return`<div class="card"><button class="pri" data-a="addReview" data-id="${p.id}">+ Add review / feedback round</button></div>
 ${p.reviews.map(r=>{const open=r.points.filter(x=>!x.done).length;return`<div class="card"><div class="row"><h3 class="sp" style="margin:0">Round ${esc(r.round)} · ${esc(r.reviewer)} <span class="chip ${/Accept|Funded/.test(r.decision)?'ok':/Reject|Not/.test(r.decision)?'bad':''}">${esc(r.decision)}</span></h3>
  <button class="sm" data-a="copyLetter" data-id="${p.id}" data-r="${r.id}">Copy response letter</button><button class="sm" data-a="dlLetter" data-id="${p.id}" data-r="${r.id}">Word</button><button class="sm" data-a="editReview" data-id="${p.id}" data-r="${r.id}">Edit</button><button class="sm danger" data-a="delReview" data-id="${p.id}" data-r="${r.id}">✕</button></div>
  <div class="mute">Received ${fmt(r.received)} · Response due ${fmt(r.due)} ${open?dueChip(r.due):''} · ${open} open point(s)</div>${r.summary?`<p>${esc(r.summary)}</p>`:''}
  ${r.points.map((x,i)=>`<div class="pt ${x.done?'done':''}"><div class="row"><b class="sp">#${i+1} ${esc(x.comment)}</b><button class="sm" data-a="editPoint" data-id="${p.id}" data-r="${r.id}" data-i="${i}">Respond</button><button class="sm" data-a="togglePoint" data-id="${p.id}" data-r="${r.id}" data-i="${i}">${x.done?'Reopen':'Mark done'}</button></div>${x.response?`<div class="mute">↳ ${esc(x.response)}</div>`:''}</div>`).join('')}

 delTask(d){const p=P(d.id);p.tasks=p.tasks.filter(t=>t.id!==d.t);save()},

 async doiLookup(d){const p=P(d.id);const doi=String(p.doi||'').replace(/^https?:\/\/(dx\.)?doi\.org\//i,'').trim();if(!doi)return toast('Add a DOI above and save first');
  try{const r=await fetch('https://api.crossref.org/works/'+encodeURIComponent(doi));if(!r.ok)throw new Error('not found');const m=(await r.json()).message;
   const au=(m.author||[]).map(a=>(a.family||'')+(a.given?', '+a.given.split(/\s+/).map(x=>x[0]+'.').join(' '):'')).join(', ');
   const yr=((m.issued||{})['date-parts']||[[]])[0][0]||'',jn=(m['container-title']||[])[0]||'';
   p.citation=`${au}${yr?' ('+yr+')':''}. ${(m.title||[])[0]||p.title}.${jn?' '+jn:''}${m.volume?', '+m.volume:''}${m.issue?'('+m.issue+')':''}${m.page?', '+m.page:''}. https://doi.org/${doi}`;
   if(!p.venue&&jn)p.venue=jn;if(yr)p.pubDate=String(yr);save();toast('Citation filled from Crossref')}catch(e){toast('DOI lookup failed. Check the DOI.')}},

 aiRun(d){const p=P(d.id),k=d.k;
  if(k==='summary')aiDo(p.id,'Review summary',async()=>({text:await claude('You help an academic respond to peer review. Be concise, specific and practical.','Summarise the reviewer comments grouped by theme. Flag the highest-risk points and note where reviewers disagree.\n\n'+ctxOf(p))}));
  if(k==='next')aiDo(p.id,'Next steps',async()=>({text:await claude('You are a pragmatic academic writing coach.','Given this writing project, list the five most useful next steps in priority order, one sentence each.\n\n'+ctxOf(p))}));
  if(k==='drafts')aiDo(p.id,'Draft responses',async()=>{const t=await claude('You draft polite, specific responses to peer reviewers. Return only JSON.','For each reviewer comment that is not done and has no response, draft a response of 2 to 4 sentences. Do not invent data; write [add detail] where the author must supply specifics. Return ONLY a JSON array of {"round":"<review id>","i":<point index>,"response":"..."}.\n\n'+ctxOf(p));
   const a=t.indexOf('['),b=t.lastIndexOf(']');const drafts=JSON.parse(t.slice(a,b+1));
   return{drafts,text:drafts.map(x=>{const r=p.reviews.find(r=>r.id===x.round),c=r&&r.points[x.i];return(r?r.reviewer:'Reviewer')+' #'+(x.i+1)+': '+(c?c.comment:'')+'\nDraft response: '+x.response}).join('\n\n')}})},

function calendar(){const y=CAL.getFullYear(),m=CAL.getMonth(),items=calItems();
 const off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),cells=Math.ceil((off+dim)/7)*7;
 const pad=n=>String(n).padStart(2,'0');let h='';
 for(let i=0;i<cells;i++){const dn=i-off+1;if(dn<1||dn>dim){h+='<div style="background:var(--bg);min-height:92px"></div>';continue}
  const iso=`${y}-${pad(m+1)}-${pad(dn)}`;const its=items.filter(x=>x.d===iso);
  h+=`<div style="min-height:92px;padding:4px;background:var(--card);${iso===today()?'outline:2px solid var(--brand);':''}"><div class="mute" style="font-size:12px">${dn}</div>${its.map(x=>`<a href="#/p/${x.id}/${x.tab||'overview'}" title="${esc(x.s)}" style="display:block;font-size:11px;margin:2px 0;padding:1px 4px;border-radius:4px;background:${x.k==='dl'?'var(--bad)':x.k==='rev'?'var(--warn)':'var(--chip)'};color:${x.k==='task'?'var(--ink)':'#fff'};overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(x.t)}</a>`).join('')}</div>`}
 return`<div class="top"><h2>${CAL.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button data-a="calPrev">‹</button><button data-a="calToday">Today</button><button data-a="calNext">›</button><button data-a="exportIcs">Export .ics</button><button data-a="calSync">Sync to Google Calendar</button></div>

 return`<section class="panel"><div class="row" style="margin-bottom:12px"><h2 class="sp" style="margin:0">Writing log</h2><button class="sm" data-a="logWords">Log words</button></div><div class="row" style="gap:28px;align-items:flex-end;flex-wrap:wrap"><div><div class="ttl" style="font-size:22px">${st} day${st===1?'':'s'}</div><div class="mute sm2">current streak</div></div><div><div class="ttl" style="font-size:22px">${wk.toLocaleString()}</div><div class="mute sm2">words in the last 7 days</div></div><div class="bars sp" title="Words per day, last 14 days">${vals.map((v,i)=>`<i style="height:${Math.max(3,Math.round(60*v/mx))}px" title="${ds[i]}: ${v} words"></i>`).join('')}</div></div></section>`}

 const grp=(t,a)=>a.length?`<div class="grp">${t}</div>${a.slice(0,10).map(row).join('')}`:'';
 const sorted=act.slice().sort((a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9'));
 return`<div class="head"><div><h1>Writing dashboard</h1><p class="sub">${act.length} active writing${act.length===1?'':'s'}, ${od.length} overdue, ${soon} due in the next 30 days, ${open} open review point${open===1?'':'s'}.</p></div></div>
 <div class="cols"><section class="panel"><h2>Needs attention</h2>${grp('Overdue',od)}${grp('This week',wk)}${grp('Next 60 days',lt)}${od.length+wk.length+lt.length?'':'<span class="mute">Nothing scheduled.</span>'}</section>
 <section class="panel" style="padding-bottom:6px"><h2>Active writings</h2><div class="wlist" style="border:0;border-radius:0;margin:0 -18px">${sorted.slice(0,8).map(pwrow).join('')||'<div class="empty">No active writings.</div>'}</div>${act.length>8?`<p style="margin:8px 0 10px"><a href="${pl('/writings')}">View all ${act.length}</a></p>`:''}</section></div>`}
function pubList(){const rows=PUB.projects.filter(p=>(!pf.type||p.type===pf.type)&&(!pf.q||(p.title+p.venue).toLowerCase().includes(pf.q.toLowerCase()))).sort((a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9'));
 const act=rows.filter(p=>!CLOSED.includes(p.stage)),done=rows.filter(p=>CLOSED.includes(p.stage));
 return`<div class="top"><h2>Writings</h2><input style="width:220px" placeholder="Search" value="${esc(pf.q)}" data-pin="q"><select style="width:170px" data-pin="type"><option value="">All types</option>${TYPES.map(t=>`<option ${pf.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
 ${act.length?`<div class="wlist">${act.map(pwrow).join('')}</div>`:'<div class="card empty">No active writings match.</div>'}
 ${done.length?`<h3 style="margin:22px 0 8px">Closed</h3><div class="wlist">${done.map(pwrow).join('')}</div>`:''}`}
function pubDetail(p){const open=p.tasks.filter(t=>!t.done),done=p.tasks.length-open.length,sh=PUB.show||{};
 const files=p.files||[];
 return`<a href="${pl('/writings')}" class="mute" style="display:inline-block;margin-bottom:10px">← All writings</a>
 <div class="head"><div><h1>${esc(p.title)}</h1><div class="meta2"><span>${esc(p.type)}</span>${p.venue?`<span>${esc(p.venue)}</span>`:''}${p.deadline?`<span>Due ${fmt(p.deadline)} ${CLOSED.includes(p.stage)?'':dueChip(p.deadline)}</span>`:''}${prioChip(p)}</div></div></div>
 <div class="card" style="padding:8px 14px 2px">${rail(p,false,true)}</div>
 ${p.wordTarget?`<div class="card">${prog(p)}</div>`:''}
 ${sh.money&&p.amount?`<div class="card"><b>${esc(p.currency||'USD')} ${Number(p.amount).toLocaleString()}</b> <span class="mute">requested${p.decisionDate?', decision expected '+fmt(p.decisionDate):''}</span></div>`:''}
 <div class="cols"><section class="card"><h3>Pending tasks (${open.length}${done?', '+done+' done':''})</h3>${open.map(t=>`<div class="item" style="cursor:default"><span class="sp">${esc(t.t)}${t.who?` <span class="chip">${esc(t.who)}</span>`:''}</span><span class="mute sm2">${fmt(t.d)}</span>${dueChip(t.d)}</div>`).join('')||'<span class="mute">Nothing pending.</span>'}</section>
 <section class="card"><h3>Reviews and submissions</h3>${p.reviews.map(r=>`<div class="item" style="cursor:default"><span class="sp">Round ${esc(r.round)}: ${esc(r.reviewer)}<br><span class="mute sm2">${r.open} of ${r.total} comments open${r.due?', response due '+fmt(r.due):''}</span></span><span class="chip">${esc(r.decision)}</span></div>`).join('')}${p.submissions.map(x=>`<div class="item" style="cursor:default"><span class="sp">${esc(x.venue||'Submission')}<br><span class="mute sm2">Submitted ${fmt(x.date)}${x.decisionDate?', decision '+fmt(x.decisionDate):''}</span></span><span class="chip">${esc(x.status)}</span></div>`).join('')}${p.reviews.length+p.submissions.length?'':'<span class="mute">No reviews or submissions yet.</span>'}</section></div>
 ${(p.team||[]).length?`<section class="card"><h3>Team</h3>${p.team.map(m=>`<div class="item" style="cursor:default"><span class="sp">${esc(m.name)}</span><span class="chip">${esc(m.role)}</span></div>`).join('')}</section>`:''}
 ${sh.files===false?'':`<section class="card"><h3>Files</h3>${files.length?`<table><tr><th>Document</th><th>Version</th><th>Kind</th><th>Date</th><th>File</th></tr>${files.slice().reverse().map(f=>`<tr><td>${esc(f.doc)}</td><td>${esc(f.label)}</td><td><span class="chip">${esc(f.kind)}</span></td><td>${fmt(f.date)}</td><td>${f.id?`<button class="link" data-a="pubPreview" data-id="${esc(f.id)}" data-n="${esc(f.name||f.doc)}">${esc(f.name||'Open')}</button> <a class="sm2" target="_blank" rel="noopener" href="https://drive.google.com/file/d/${encodeURIComponent(f.id)}/view">Drive</a>`:(f.link?`<a target="_blank" rel="noopener" href="${esc(f.link)}">${esc(f.name||'Open')}</a>`:esc(f.name||''))}</td></tr>`).join('')}</table><p class="mute sm2" style="margin:10px 0 0">Files open in Google Drive. You need a Google account with access to the file, and Google will ask you to sign in.</p>`:'<span class="mute">No files listed.</span>'}</section>`}`}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.pin==='q'){pf.q=t.value;const pos=t.selectionStart;renderPublic();const i=document.querySelector('[data-pin=q]');if(i){i.focus();i.setSelectionRange(pos,pos)}}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.pin==='type'){pf.type=t.value;renderPublic()}});

/* ---------- File viewer ---------- */
let VW=null;
const driveIdFromUrl=u=>{const m=String(u||'').match(/\/d\/([\w-]{15,})|[?&]id=([\w-]{15,})/);return m?(m[1]||m[2]):''};
const GAPPS={'application/vnd.google-apps.document':{ex:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',ext:'docx',label:'Word'},
 'application/vnd.google-apps.spreadsheet':{ex:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',ext:'xlsx',label:'Excel'},
 'application/vnd.google-apps.presentation':{ex:'application/vnd.openxmlformats-officedocument.presentationml.presentation',ext:'pptx',label:'PowerPoint'}};
let UNDO=null;
function toast(m,undo){const t=$('#toast');t.innerHTML=esc(m)+(undo?' <button class="sm" data-a="undo">Undo</button>':'');t.style.pointerEvents=undo?'auto':'none';t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),undo?9000:2600)}
function loadScript(src,test){return new Promise((res,rej)=>{if(test())return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load the document reader'));document.head.appendChild(s)})}
function applyTheme(){const t=localStorage.getItem('wf.theme')||'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;const b=$('#themeBtn');if(b)b.textContent='Theme: '+t}
function openViewer(o){closeViewer(true);VW={...o,urls:[]};$('#viewer').classList.add('on');document.body.classList.add('noscroll');loadViewer()}
function closeViewer(keep){if(VW)VW.urls.forEach(u=>URL.revokeObjectURL(u));VW=null;if(!keep){$('#viewer').classList.remove('on');$('#viewer').innerHTML='';document.body.classList.remove('noscroll')}}
function vShell(cur,body,tools,link){
 const sw=VW.list&&VW.list.length>1?`<select class="vsel" data-vw="sw" aria-label="Version">${VW.list.map((x,i)=>`<option value="${i}" ${i===VW.idx?'selected':''}>${esc(x.label)}: ${esc(x.name)}</option>`).join('')}</select>`:'';
 return`<div class="vbar"><div class="vt"><b>${esc(cur.name||VW.title||'File')}</b>${VW.sub?`<span class="mute sm2">${esc(VW.sub)}</span>`:''}</div>${sw}<div class="vtools">${tools||''}${link?`<a class="btn" target="_blank" rel="noopener" href="${esc(link)}">Open in Drive</a>`:''}<button data-a="vwClose">Close</button></div></div><div class="vbody">${body}</div>`}
async function loadViewer(){
 const el=$('#viewer'),mine=VW,cur=mine.list?mine.list[mine.idx]:{id:mine.id,name:mine.title,label:''};mine.cur=cur;mine.gm=null;
 el.innerHTML=vShell(cur,'<div class="vmsg">Opening file…</div>','','');
 try{
  const meta=await(await g(`https://www.googleapis.com/drive/v3/files/${cur.id}?fields=id,name,mimeType,size,webViewLink`,{},mine.acct)).json();
  if(VW!==mine)return;
  const mt=meta.mimeType||'',size=+meta.size||0,name=meta.name||cur.name||'file',media=`https://www.googleapis.com/drive/v3/files/${meta.id}?alt=media`;
  const url=(b,type)=>{const u=URL.createObjectURL(type?new Blob([b],{type}):b);mine.urls.push(u);return u};
  const blob=async(u,type)=>url(await(await g(u,{},mine.acct)).blob(),type);
  const down=(u,n,l)=>`<a class="btn" href="${u}" download="${esc(n)}">${l}</a>`;
  let body,tools='';
  if(GAPPS[mt]){mine.gm=GAPPS[mt];const u=await blob(`https://www.googleapis.com/drive/v3/files/${meta.id}/export?mimeType=application%2Fpdf`,'application/pdf');
   body=`<iframe class="vframe" src="${u}"></iframe>`;tools=down(u,name+'.pdf','Download PDF')+`<button data-a="vwExport">Download ${GAPPS[mt].label}</button>`}
  else if(mt==='application/pdf'&&size<60e6){const u=await blob(media,'application/pdf');body=`<iframe class="vframe" src="${u}"></iframe>`;tools=down(u,name,'Download')}
  else if(mt.startsWith('image/')&&size<40e6){const u=await blob(media);body=`<img class="vimg" src="${u}" alt="${esc(name)}">`;tools=down(u,name,'Download')}
  else if((mt.startsWith('video/')||mt.startsWith('audio/'))&&size<150e6){const u=await blob(media);body=mt.startsWith('video/')?`<video class="vframe" controls src="${u}"></video>`:`<audio controls src="${u}" style="margin:auto"></audio>`;tools=down(u,name,'Download')}
  else if(/wordprocessingml\.document$/.test(mt)||/\.docx$/i.test(name)){
   await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',()=>window.mammoth);
   const ab=await(await g(media,{},mine.acct)).arrayBuffer();const r=await window.mammoth.convertToHtml({arrayBuffer:ab});
   mine.docHtml='<style>body{font:16px/1.65 Georgia,serif;max-width:780px;margin:32px auto;padding:0 24px;color:#111}img{max-width:100%}table{border-collapse:collapse}td,th{border:1px solid #bbb;padding:4px 8px}</style>'+r.value;
   body='<iframe class="vframe" sandbox data-doc></iframe>';tools=down(url(new Blob([ab])),name,'Download')}
  else if((mt.startsWith('text/')||mt==='application/json'||mt==='application/xml'||/\.(txt|md|csv|json|tex|bib|xml)$/i.test(name))&&size<1e6){const t=await(await g(media,{},mine.acct)).text();body=`<pre class="vtext">${esc(t)}</pre>`}
  else{body=`<iframe class="vframe" src="https://drive.google.com/file/d/${meta.id}/preview?authuser=${encodeURIComponent(mine.acct||'')}"></iframe>`}
  if(VW!==mine)return;
  el.innerHTML=vShell(cur,body,tools,meta.webViewLink);
  const f=el.querySelector('iframe[data-doc]');if(f)f.srcdoc=mine.docHtml;
 }catch(e){if(VW===mine)el.innerHTML=vShell(cur,`<div class="vmsg">Could not open this file.<br>${esc(e.message)}</div>`,'','')}}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.vw==='sw'&&VW){VW.idx=+t.value;loadViewer()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&(VW||$('#viewer').classList.contains('on'))){VW?closeViewer():A.pubClose();return}
 const typing=e.target.closest&&e.target.closest('input,textarea,select,dialog');
 if(!typing&&signedIn&&!VW&&e.key==='n'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();A.newProject()}});
window.addEventListener('hashchange',()=>document.body.classList.remove('menu'));

/* ---------- Import from Drive folder ---------- */
let IMP=[];const FOLD='application/vnd.google-apps.folder';
async function listKids(id,acct){let out=[],tok='';do{const r=await(await g('https://www.googleapis.com/drive/v3/files?pageSize=200&fields=nextPageToken,files(id,name,mimeType,webViewLink,modifiedTime)&q='+encodeURIComponent(`'${id}' in parents and trashed=false`)+(tok?'&pageToken='+tok:''),{},acct)).json();out=out.concat(r.files);tok=r.nextPageToken||''}while(tok);return out}
async function scanTree(id,name,depth,acct){const kids=await listKids(id,acct);
 const n={id,name,files:kids.filter(k=>k.mimeType!==FOLD&&!k.mimeType.includes('shortcut')),folders:[]};
 const fs=kids.filter(k=>k.mimeType===FOLD);
 n.folders=depth>0?await Promise.all(fs.map(k=>scanTree(k.id,k.name,depth-1,acct))):fs.map(k=>({id:k.id,name:k.name,files:[],folders:[]}));return n}
const SUBRX=/^(drafts?|versions?|final|submitted|reviews?|supporting|annex(es)?|attachments?|old|archive|budget|references)$/i;
function allFiles(n,sub=''){return n.files.map(f=>({...f,sub})).concat(...n.folders.map(f=>allFiles(f,f.name)))}
function findProjects(n,path,out){
 const isProj=n.files.length||(n.folders.length&&n.folders.every(f=>SUBRX.test(f.name.trim())));
 if(isProj){out.push({id:n.id,name:n.name,path,files:allFiles(n)});return}
 n.folders.forEach(f=>findProjects(f,path.concat(n.name),out))}
function guessType(s){
 if(/chapter/.test(s))return'Book chapter';if(/\bbooks?\b/.test(s))return'Book';if(/conference|proceedings/.test(s))return'Conference paper';
 if(/grant|bid|proposal|funding|concept note|tender|rfp|consultancy/.test(s))return'Grant proposal';if(/case stud/.test(s))return'Case study';
 if(/article|journal|paper|manuscript/.test(s))return'Journal article';if(/research|thesis|dissertation/.test(s))return'Research';
 if(/report|brief/.test(s))return'Report / policy brief';return'Other'}
function baseName(name){let b=name.replace(/\.[^.]+$/,''),prev;
 const rx=/[\s_\-\(\[]*(v\s?\d+(\.\d+)*|final|draft|revised?|copy|\d{4}[-_]?\d{2}[-_]?\d{2}|\(\d+\))[\s_\-\)\]]*$/i;
 for(let i=0;i<3;i++){prev=b;b=b.replace(rx,'');if(b===prev)break}return b.trim()||name}
function guessKind(t){t=t.toLowerCase();
 if(/final/.test(t))return'Final';if(/submit/.test(t))return'Submitted';if(/respon|rebuttal/.test(t))return'Reviewer response';
 if(/review|comment|feedback/.test(t))return'Shared for review';if(/annex|budget|support|attach|refer/.test(t))return'Supporting';
 if(/revis/.test(t))return'Revised';return'Draft'}
function buildVersions(files){const groups={};
 files.slice().sort((a,b)=>(a.modifiedTime||'').localeCompare(b.modifiedTime||'')).forEach(f=>{const b=baseName(f.name),k=b.toLowerCase();(groups[k]=groups[k]||{doc:b,items:[]}).items.push(f)});
 return Object.values(groups).flatMap(gp=>gp.items.map((f,i)=>({id:uid(),doc:gp.doc,n:i+1,label:'v'+(i+1),kind:guessKind(f.name+' '+f.sub),note:f.sub?'Folder: '+f.sub:'',date:(f.modifiedTime||'').slice(0,10)||today(),fileName:f.name,driveId:f.id,link:f.webViewLink})))}
function impDraw(){
 $('#dlg').innerHTML=`<h3 style="margin-top:0">Review import (${IMP.length} found)</h3><p class="mute">Untick anything you don't want. Edit titles and types. Files stay in Drive.</p>
 <div style="max-height:55vh;overflow:auto"><table><tr><th></th><th>Title</th><th>Type</th><th>Files</th></tr>${IMP.map((x,i)=>`<tr><td><input type="checkbox" style="width:auto" ${x.on?'checked':''} data-imp="on" data-i="${i}"></td><td><input value="${esc(x.title)}" data-imp="title" data-i="${i}"><div class="mute">${esc(x.path.join(' / '))}${x.dup?' · already imported':''}</div></td><td><select data-imp="type" data-i="${i}">${TYPES.map(t=>`<option ${t===x.type?'selected':''}>${t}</option>`).join('')}</select></td><td>${x.files.length}</td></tr>`).join('')||'<tr><td colspan=4 class="mute">No projects found in this folder.</td></tr>'}</table></div>
 <div class="row" style="margin-top:12px"><span class="sp"></span><button data-a="closeDlg">Cancel</button><button class="pri" data-a="impGo">Import selected</button></div>`}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.imp===undefined)return;const x=IMP[+t.dataset.i],k=t.dataset.imp;x[k]=k==='on'?t.checked:t.value});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='brq'){e.preventDefault();A.brSearch()}});

/* ---------- Global events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(b){e.stopPropagation();A[b.dataset.a]?.(b.dataset);return}
 const g=e.target.closest('[data-go]');if(g&&!e.target.closest('button,a,input,select'))location.hash=g.dataset.go});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.in){if(t.dataset.in==='boardType')boardType=t.value;else filt[t.dataset.in]=t.type==='checkbox'?t.checked:t.value;render();return}
 const a=t.dataset.aChange;if(!a)return;const p=P(t.dataset.id);
 if(a==='stage'){p.stage=t.value;save()}
 if(a==='toggleTask'){const k=p.tasks.find(x=>x.id===t.dataset.t);k.done=t.checked;save()}
 if(a==='taskDue'){p.tasks.find(x=>x.id===t.dataset.t).due=t.value;save()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.in==='q'){filt.q=t.value;const pos=t.selectionStart;render();const i=document.querySelector('[data-in=q]');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{
 const f=e.target;if(!['ov','addtask','nt'].includes(f.id))return;e.preventDefault();
 const p=P(route().id),fd=Object.fromEntries(new FormData(f));
 if(f.id==='ov'){if(fd.account&&fd.account!==acctOf(p)&&p.folderId){if(!confirm('Changing the account unlinks the current Drive folder (files stay in Drive). Continue?'))return;p.folderId=''}const typeChanged=fd.type!==p.type;p.private=!!fd.private;delete fd.private;if(fd.words!==undefined){if(fd.words!==''&&+fd.words!==+(p.words||0))setWords(p,fd.words);delete fd.words}Object.assign(p,fd);if(typeChanged&&!PIPE[p.type].includes(p.stage))p.stage=PIPE[p.type][0]}
 if(f.id==='addtask')p.tasks.push({id:uid(),title:fd.t,due:fd.d,done:false,who:fd.who||''});
 if(f.id==='nt')p.notes=fd.notes;
 p.updated=Date.now();save()});

applyTheme();render();if(window.google)initGIS();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
